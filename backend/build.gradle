plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.4'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // 요청 DTO 검증 (@Valid, @NotBlank 등) - web 스타터에 포함되지 않는다
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // .env 로딩 (로컬 개발용 - 배포 환경은 실제 환경변수 사용)
    implementation 'io.github.cdimascio:dotenv-java:3.0.0'

    // DB관련 의존성
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'

    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.flywaydb:flyway-mysql'

    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client:3.4.1'

    // --- Security + JWT (Nexus와 동일 - 필터 구현은 회원 담당) ---
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    implementation 'io.jsonwebtoken:jjwt-impl:0.12.6'
    implementation 'io.jsonwebtoken:jjwt-orgjson:0.12.6'

    // --- API 문서 (Swagger UI: /swagger-ui.html) ---
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.4'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // 테스트는 인메모리 H2(MariaDB 모드) - 로컬 DB 없이도 빌드·CI 통과
    testRuntimeOnly 'com.h2database:h2'

    // SMTP 이메일 전송
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // OAuth 추가
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

    // minio 추가
    implementation 'io.minio:minio:9.0.3'
    // ImageIO 기본 리더가 지원하지 않는 WebP 파일 검증
    runtimeOnly 'com.twelvemonkeys.imageio:imageio-webp:3.13.1'
}

bootJar {
    archiveFileName = 'hangat-api.jar'
}

tasks.named('test') {
    useJUnitPlatform()
}
