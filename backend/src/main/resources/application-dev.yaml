spring:
  application:
    name: hangat-api

  # 기본값은 backend/docker-compose.yml 의 MariaDB와 일치 - .env 없이도 부팅된다
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/hangat}
    username: ${DB_USER:hangat}
    password: ${DB_PASS:hangat}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000


  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        default_batch_fetch_size: 100

  # 메일 발송
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            client-name: Google
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
              - email
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-name: Kakao
            provider: kakao
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-info-authentication-method: header
            user-name-attribute: id

# JWT
jwt:
  secret: ${JWT_SECRET}
  access-ttl-ms: 600000 # 10분 - 프론트와 맞춤.

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health, info

# 날씨 조회용 API
weather:
  base-url: https://apis.data.go.kr/1360000
  service-key: ${SERVICE_KEY}
  ingest:
    # 개발 머신마다 밤에 기상청을 부르지 않는다 - 수동 실행은 POST /admin/ingest/weather
    enabled: false

tour-api:
  base-url: ${TOUR_API_BASE_URL}
  service-key: ${TOUR_API_SERVICE_KEY}

congestion-api:
  base-url: ${CONGESTION_API_BASE_URL}
  service-key: ${TOUR_API_SERVICE_KEY}

gemini:
  base-url: https://generativelanguage.googleapis.com/v1beta
  api-key: ${GEMINI_API_KEY:}
  model: gemini-3.6-flash
  connect-timeout: 3s
  read-timeout: 120s

app:
  frontend-url: ${FRONTEND_URL:http://localhost:4173}
  backend-url: ${BACKEND_URL:http://localhost:8080}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4173,http://localhost:5173}
  cookie:
    secure: false
  mail:
    from: ${MAIL_FROM}
  auth:
    code-hmac-secret: ${APP_AUTH_CODE_HMAC_SECRET}
# 공공데이터포털 - 한국관광공사 계열 (KorService2 / 집중률 / 방문자수)
# ★ service-key 는 Decoding 키. 계정당 인증키 1개가 활용신청한 모든 API에 통하므로 weather와 같은 값을 쓴다
public-api:
  service-key: ${SERVICE_KEY}
  tour-base-url: https://apis.data.go.kr/B551011

# 샘플 코스 기동 생성 - dev 편의용. 내일 출발 READY가 이미 있으면 스킵 (운영은 새벽 4시 스케줄만)
sample-courses:
  generate-on-startup: true

kakao-local:
  rest-key: ${KAKAO_LOCAL_REST_KEY:}

kakao-mobility:
  rest-key: ${KAKAO_LOCAL_REST_KEY:}
  base-url: https://apis-navi.kakaomobility.com
  connect-timeout: 3s
  read-timeout: 15s
  max-attempts: 3
  retry-backoff: 200ms
  cache-ttl: 10m
  cache-max-size: 128
