# 운영(OCI) 프로필 - 모든 비밀값은 서버 환경변수로 주입한다 (파일에 직접 기입 금지)
spring:
  application:
    name: hangat-api

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

    # ────────────────────────── 운영 DB 마이그레이션 ──────────────────────────

  flyway:
    enabled: true
    locations: classpath:db/migration
    encoding: UTF-8
    validate-on-migrate: true
    clean-disabled: true
    fail-on-missing-locations: true
    out-of-order: false
    baseline-on-migrate: false

  jpa:
    hibernate:
      # Nexus는 update였으나 운영 스키마 보호를 위해 validate로 시작 (팀 협의로 변경 가능)
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        default_batch_fetch_size: 100

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            client-name: Google
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
              - email
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-name: Kakao
            provider: kakao
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-info-authentication-method: header
            user-name-attribute: id

jwt:
  secret: ${JWT_SECRET}
  access-ttl-ms: 600000

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health

# 날씨 조회용 API
weather:
  base-url: https://apis.data.go.kr/1360000
  service-key: ${SERVICE_KEY}
  ingest:
    # 03:30(02시 발표분, 04:00 샘플 코스 배치 앞)·06:30(05시 단기·06시 중기) KST
    enabled: true
    # 배포 직후 첫 스케줄까지 기다리지 않고 채우려면 true - 발표분 단위 멱등이라 재기동해도 중복 없음
    on-startup: ${WEATHER_INGEST_ON_STARTUP:false}

tour-api:
  base-url: ${TOUR_API_BASE_URL}
  service-key: ${TOUR_API_SERVICE_KEY}

congestion-api:
  base-url: ${CONGESTION_API_BASE_URL}
  service-key: ${TOUR_API_SERVICE_KEY}

gemini:
  base-url: https://generativelanguage.googleapis.com/v1beta
  api-key: ${GEMINI_API_KEY:}
  model: gemini-3.6-flash
  connect-timeout: 3s
  read-timeout: 120s

app:
  frontend-url: ${FRONTEND_URL}
  backend-url: ${BACKEND_URL}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  cookie:
    secure: true
  mail:
    from: ${MAIL_FROM}
  auth:
    code-hmac-secret: ${APP_AUTH_CODE_HMAC_SECRET}
  storage:
    type: minio
    minio:
      endpoint: ${MINIO_ENDPOINT}
      bucket: ${MINIO_BUCKET}
      access-key: ${MINIO_ACCESS_KEY}
      secret-key: ${MINIO_SECRET_KEY}
# 관광정보·집중률 조회용 API
public-api:
  service-key: ${SERVICE_KEY}
  tour-base-url: https://apis.data.go.kr/B551011

kakao-local:
  rest-key: ${KAKAO_LOCAL_REST_KEY:}

kakao-mobility:
  rest-key: ${KAKAO_LOCAL_REST_KEY:}
  base-url: https://apis-navi.kakaomobility.com
  connect-timeout: 3s
  read-timeout: 15s
  max-attempts: 3
  retry-backoff: 200ms
  cache-ttl: 10m
  cache-max-size: 128
