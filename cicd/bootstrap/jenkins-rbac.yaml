apiVersion: v1
kind: ServiceAccount

metadata:
  name: jenkins-deployer
  namespace: hangat
  labels:
    app.kubernetes.io/name: hangat
    app.kubernetes.io/part-of: hangat
    app.kubernetes.io/component: cicd

automountServiceAccountToken: false

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role

metadata:
  name: jenkins-deployer
  namespace: hangat
  labels:
    app.kubernetes.io/name: hangat
    app.kubernetes.io/part-of: hangat
    app.kubernetes.io/component: cicd

rules:
  # Helm release 정보와 한갓 애플리케이션 리소스
  - apiGroups:
      - ""
    resources:
      - configmaps
      - secrets
      - services
      - persistentvolumeclaims
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

  # helm --wait와 kubectl rollout status가 Pod 상태를 읽는다.
  - apiGroups:
      - ""
    resources:
      - pods
      - pods/log
      - events
    verbs:
      - get
      - list
      - watch

  # 백엔드·프론트 Deployment
  - apiGroups:
      - apps
    resources:
      - deployments
      - deployments/status
      - replicasets
      - replicasets/status
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

  # 한갓 도메인 Ingress
  - apiGroups:
      - networking.k8s.io
    resources:
      - ingresses
      - ingresses/status
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding

metadata:
  name: jenkins-deployer
  namespace: hangat
  labels:
    app.kubernetes.io/name: hangat
    app.kubernetes.io/part-of: hangat
    app.kubernetes.io/component: cicd

subjects:
  - kind: ServiceAccount
    name: jenkins-deployer
    namespace: hangat

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jenkins-deployer