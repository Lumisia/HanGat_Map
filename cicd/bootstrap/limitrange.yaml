apiVersion: v1
kind: LimitRange

metadata:
  name: hangat-default-limits
  namespace: hangat
  labels:
    app.kubernetes.io/name: hangat
    app.kubernetes.io/part-of: hangat
    app.kubernetes.io/component: namespace-policy

spec:
  limits:
    # resources를 누락한 Container에 적용할 기본 안전값이다.
    - type: Container

      defaultRequest:
        cpu: 50m
        memory: 100Mi

      default:
        cpu: 500m
        memory: 512Mi

      min:
        cpu: 50m
        memory: 100Mi

      max:
        cpu: "2"
        memory: 2Gi

    # 현재 local-path PVC 하나가 과도한 용량을 요청하지 못하게 한다.
    - type: PersistentVolumeClaim

      min:
        storage: 1Gi

      max:
        storage: 10Gi