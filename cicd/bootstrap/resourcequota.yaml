apiVersion: v1
kind: ResourceQuota

metadata:
  name: hangat-resource-quota
  namespace: hangat
  labels:
    app.kubernetes.io/name: hangat
    app.kubernetes.io/part-of: hangat
    app.kubernetes.io/component: namespace-policy

spec:
  hard:
    # Namespace 전체 Container의 요청량 합계
    requests.cpu: "1"
    requests.memory: 2Gi

    # Namespace 전체 Container의 제한량 합계
    limits.cpu: "3"
    limits.memory: 4Gi

    # 오작동으로 리소스가 무한 생성되는 것을 방지
    pods: "10"
    services: "10"
    configmaps: "20"
    secrets: "30"

    # 후기 이미지 PVC와 향후 확장 여유
    persistentvolumeclaims: "3"
    requests.storage: 10Gi

    # 잘못된 배포 리소스 누적 방지
    count/deployments.apps: "10"
    count/replicasets.apps: "20"
    count/ingresses.networking.k8s.io: "10"