{{- /*
애플리케이션 부팅에 반드시 필요한 비밀값을 검사한다.
선택 기능인 GEMINI_API_KEY, KAKAO_LOCAL_REST_KEY는 제외한다.
*/ -}}

{{- $requiredSecretKeys := list
      "DB_USER"
      "DB_PASS"
      "JWT_SECRET"
      "APP_AUTH_CODE_HMAC_SECRET"
      "MAIL_PASSWORD"
      "GOOGLE_CLIENT_ID"
      "GOOGLE_CLIENT_SECRET"
      "KAKAO_CLIENT_ID"
      "KAKAO_CLIENT_SECRET"
      "SERVICE_KEY"
      "TOUR_API_SERVICE_KEY"
      "MINIO_ENDPOINT"
      "MINIO_BUCKET"
      "MINIO_ACCESS_KEY"
      "MINIO_SECRET_KEY"
-}}

{{- range $key := $requiredSecretKeys }}
  {{- $value := index $.Values.backend.secretEnv $key | default "" }}
  {{- if empty $value }}
    {{- fail (printf "backend.secretEnv.%s 값이 필요합니다." $key) }}
  {{- end }}
{{- end }}

apiVersion: v1
kind: Secret

metadata:
  name: {{ include "hangat.fullname" . }}-backend-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hangat.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend

type: Opaque

stringData:
  {{- range $key, $value := .Values.backend.secretEnv }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
