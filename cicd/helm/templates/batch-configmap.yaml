{{- if .Values.batch.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hangat.fullname" . }}-batch-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hangat.labels" . | nindent 4 }}
    app.kubernetes.io/component: batch
data:
  SPRING_PROFILES_ACTIVE: "prod,batch"
  {{- /* 임의 env 전체 복사 금지: 배치가 실제 사용하는 공개 설정만 허용한다. */}}
  {{- range $key := list "DB_URL" "TZ" "JAVA_TOOL_OPTIONS" "TOUR_API_BASE_URL" "CONGESTION_API_BASE_URL" "HANGAT_NOTIFICATIONS_ENABLED" "HANGAT_TRIP_ALERTS_ENABLED" "HANGAT_TRIP_NOTIFICATIONS_ENABLED" }}
  {{- $value := index $.Values.backend.configEnv $key | default "" | toString }}
  {{- if empty (trim $value) }}
  {{- fail (printf "배치 실행에 backend.configEnv.%s 값이 필요합니다." $key) }}
  {{- end }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
