{{- if .Values.batch.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hangat.fullname" . }}-batch-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hangat.labels" . | nindent 4 }}
    app.kubernetes.io/component: batch
type: Opaque
stringData:
  {{- /* 원본은 기존 Jenkins private values를 유지하되 배치 소비 범위만 제한한다. */}}
  {{- /* places의 착한가격 업소 주소 → 좌표 변환에는 지도 JavaScript 키가 아닌 카카오 REST 키가 필요하다. */}}
  {{- range $key := list "DB_USER" "DB_PASS" "SERVICE_KEY" "TOUR_API_SERVICE_KEY" "KAKAO_LOCAL_REST_KEY" }}
  {{- $value := index $.Values.backend.secretEnv $key | default "" | toString }}
  {{- if empty (trim $value) }}
  {{- fail (printf "배치 실행에 backend.secretEnv.%s 값이 필요합니다." $key) }}
  {{- end }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
