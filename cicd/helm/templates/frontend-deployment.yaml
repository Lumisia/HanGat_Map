apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ include "hangat.fullname" . }}-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hangat.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend

spec:
  replicas: {{ .Values.frontend.replicaCount }}
  revisionHistoryLimit: {{ .Values.frontend.revisionHistoryLimit }}

  strategy:
    {{- toYaml .Values.frontend.strategy | nindent 4 }}

  selector:
    matchLabels:
      {{- include "hangat.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend

  template:
    metadata:
      labels:
        {{- include "hangat.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: frontend

    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 15

      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      securityContext:
        {{- toYaml .Values.frontend.podSecurityContext | nindent 8 }}

      containers:
        - name: frontend

          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}

          securityContext:
            {{- toYaml .Values.frontend.containerSecurityContext | nindent 12 }}

          ports:
            - name: http
              containerPort: {{ .Values.frontend.service.targetPort }}
              protocol: TCP

          {{- if .Values.frontend.probes.startup.enabled }}
          startupProbe:
            {{- toYaml .Values.frontend.probes.startup.spec | nindent 12 }}
          {{- end }}

          {{- if .Values.frontend.probes.liveness.enabled }}
          livenessProbe:
            {{- toYaml .Values.frontend.probes.liveness.spec | nindent 12 }}
          {{- end }}

          {{- if .Values.frontend.probes.readiness.enabled }}
          readinessProbe:
            {{- toYaml .Values.frontend.probes.readiness.spec | nindent 12 }}
          {{- end }}

          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}