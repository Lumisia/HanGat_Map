apiVersion: v1
kind: Service

metadata:
  name: {{ include "hangat.fullname" . }}-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hangat.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend

spec:
  type: {{ .Values.frontend.service.type }}

  selector:
    {{- include "hangat.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend

  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.frontend.service.port }}
      targetPort: http