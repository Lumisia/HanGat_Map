{{- if and .Values.ingress.enabled .Values.ingress.swagger.enabled }}

apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: {{ include "hangat.fullname" . }}-swagger
  namespace: {{ .Release.Namespace }}

  labels:
    {{- include "hangat.labels" . | nindent 4 }}
    app.kubernetes.io/component: api-documentation

  annotations:
    # swagger.hangatjeju.com 루트 접속 시 Swagger UI로 이동한다.
    nginx.ingress.kubernetes.io/app-root: /swagger-ui/index.html

    nginx.ingress.kubernetes.io/ssl-redirect: {{ .Values.ingress.forceSslRedirect | quote }}
    nginx.ingress.kubernetes.io/force-ssl-redirect: {{ .Values.ingress.forceSslRedirect | quote }}

spec:
  ingressClassName: {{ .Values.ingress.className }}

  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.swagger.host | quote }}

      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}

  rules:
    - host: {{ .Values.ingress.swagger.host | quote }}

      http:
        paths:
          # 대표 주소는 app-root를 통해 Swagger UI로 이동한다.
          - path: /
            pathType: Exact

            backend:
              service:
                name: {{ include "hangat.fullname" . }}-backend

                port:
                  number: {{ .Values.backend.service.port }}

          # Swagger 정적 파일과 OpenAPI 명세 경로만 외부에 공개한다.
          - path: /swagger-ui
            pathType: Prefix

            backend:
              service:
                name: {{ include "hangat.fullname" . }}-backend

                port:
                  number: {{ .Values.backend.service.port }}

          - path: /swagger-ui.html
            pathType: Exact

            backend:
              service:
                name: {{ include "hangat.fullname" . }}-backend

                port:
                  number: {{ .Values.backend.service.port }}

          - path: /v3/api-docs
            pathType: Prefix

            backend:
              service:
                name: {{ include "hangat.fullname" . }}-backend

                port:
                  number: {{ .Values.backend.service.port }}

{{- end }}
