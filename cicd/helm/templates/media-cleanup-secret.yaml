{{- if and .Values.batch.enabled (or (hasKey .Values.batch.jobs "media-cleanup") (hasKey .Values.batch.jobs "account-media-cleanup")) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hangat.fullname" . }}-media-cleanup-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hangat.labels" . | nindent 4 }}
    app.kubernetes.io/component: batch
type: Opaque
stringData:
  {{- range $key := list "MINIO_ENDPOINT" "MINIO_BUCKET" "MINIO_ACCESS_KEY" "MINIO_SECRET_KEY" }}
  {{- $value := index $.Values.backend.secretEnv $key | default "" | toString }}
  {{- if empty (trim $value) }}
  {{- fail (printf "사진 정리에는 backend.secretEnv.%s 값이 필요합니다." $key) }}
  {{- end }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
