# ────────────────────────── OCI k3s 백엔드 ──────────────────────────

backend:
  replicaCount: 1

  configEnv:
    # 운영 DB에 준비된 심사용 계정으로 버튼 로그인을 허용한다.
    # 중단할 때는 Jenkins private values에서 false로 덮어쓸 수 있다.
    APP_DEMO_LOGIN_ENABLED: "true"
    DB_URL: "jdbc:mariadb://mariadb.fileinnout.svc.cluster.local:3306/hangat"

    FRONTEND_URL: "https://hangatjeju.com"
    BACKEND_URL: "https://api.hangatjeju.com"
    CORS_ALLOWED_ORIGINS: "https://hangatjeju.com"

  persistence:
    enabled: true
    storageClassName: local-path
    accessMode: ReadWriteOnce
    size: 5Gi


# ────────────────────────── OCI k3s 프론트엔드 ──────────────────────────

frontend:
  replicaCount: 1


# ────────────────────────── OCI ingress-nginx ──────────────────────────

ingress:
  enabled: true

  className: nginx
  forceSslRedirect: "true"

  tls:
    enabled: true
    secretName: hangat-tls

  web:
    host: hangatjeju.com

  api:
    host: api.hangatjeju.com

  swagger:
    enabled: false
    host: swagger.hangatjeju.com
