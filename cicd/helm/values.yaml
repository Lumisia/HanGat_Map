# ────────────────────────── 공통 이름 ──────────────────────────

nameOverride: ""
fullnameOverride: ""

# Docker Hub 저장소가 공개라면 빈 배열을 유지한다.
# 비공개 저장소라면 다음과 같이 지정한다.
#
# imagePullSecrets:
#   - name: dockerhub-lumisia
imagePullSecrets: []


# ────────────────────────── 백엔드 ──────────────────────────

# Jenkins가 전체 커밋 해시로 덮어쓴다. 비밀값은 넣지 않는다.
deployment:
  revision: unknown

backend:
  replicaCount: 1
  revisionHistoryLimit: 3

  # 적재 예약은 CronJob이 담당한다. API 예약 실행과 중복 활성화하지 않는다.
  scheduling:
    enabled: false

  image:
    repository: lumisia/hangat-backend
    tag: latest
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 80
    targetPort: 8080

  # 현재 로컬 PVC와 @Scheduled 배치를 사용하므로
  # 구버전과 신버전 Pod가 동시에 실행되지 않게 한다.
  strategy:
    type: Recreate

  configEnv:
    # 데모 계정 생성·이메일 인증 확인 후 true로 활성화한다. 비밀번호는 필요 없다.
    APP_DEMO_LOGIN_ENABLED: "false"
    SPRING_PROFILES_ACTIVE: "prod"
    SERVER_PORT: "8080"
    TZ: "Asia/Seoul"

    JAVA_TOOL_OPTIONS: >-
      -XX:MaxRAMPercentage=75.0
      -XX:+ExitOnOutOfMemoryError
      -Djava.io.tmpdir=/tmp

    # MAIL 관련
    MAIL_HOST: "smtp.resend.com"
    MAIL_PORT: "587"
    MAIL_USERNAME: "resend"
    MAIL_FROM: "no-reply@hangatjeju.com"

    # 프론트 백엔드 및 CORS 설정
    FRONTEND_URL: "https://hangatjeju.com"
    BACKEND_URL: "https://api.hangatjeju.com"
    CORS_ALLOWED_ORIGINS: "https://hangatjeju.com"

    # 외부 API 설정
    TOUR_API_BASE_URL: "https://apis.data.go.kr/B551011/KorService2/areaBasedList2"
    CONGESTION_API_BASE_URL: "https://apis.data.go.kr/B551011/TatsCnctrRateService/tatsCnctrRatedList"

    APP_UPLOAD_DIR: "/app/uploads/reviews"

    MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
    MANAGEMENT_ENDPOINT_HEALTH_GROUP_READINESS_INCLUDE: "readinessState,db"
    HANGAT_ASYNC_ENABLED: "true"
    HANGAT_ASYNC_PARALLELISM: "2"
    HANGAT_ASYNC_MAX_PENDING: "50"
    HANGAT_ASYNC_MAX_ACTIVE_PER_USER: "2"

    HANGAT_NOTIFICATIONS_ENABLED: "true"
    HANGAT_TRIP_ALERTS_ENABLED: "true"
    HANGAT_TRIP_NOTIFICATIONS_ENABLED: "true"

  # 실제 값은 Jenkins의 hangat-values-private 파일이 덮어쓴다.
  secretEnv:
    DB_USER: ""
    DB_PASS: ""

    JWT_SECRET: ""
    APP_AUTH_CODE_HMAC_SECRET: ""

    MAIL_PASSWORD: ""

    GOOGLE_CLIENT_ID: ""
    GOOGLE_CLIENT_SECRET: ""

    KAKAO_CLIENT_ID: ""
    KAKAO_CLIENT_SECRET: ""

    SERVICE_KEY: ""
    TOUR_API_SERVICE_KEY: ""

    # 운영 AI 생성·경로 조회에 필수. 빈 값·공백이면 Helm 검증에서 배포를 중단한다.
    GEMINI_API_KEY: ""
    KAKAO_LOCAL_REST_KEY: ""

    # 실제 주소·버킷·키는 Jenkins private values에서만 제공한다.
    MINIO_ENDPOINT: ""
    MINIO_BUCKET: ""
    MINIO_ACCESS_KEY: ""
    MINIO_SECRET_KEY: ""

  persistence:
    enabled: true
    existingClaim: ""
    storageClassName: ""
    accessMode: ReadWriteOnce
    size: 5Gi

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault

  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1536Mi

  probes:
    startup:
      enabled: true
      spec:
        httpGet:
          path: /actuator/health/liveness
          port: http
        periodSeconds: 5
        timeoutSeconds: 3
        failureThreshold: 30

    liveness:
      enabled: true
      spec:
        httpGet:
          path: /actuator/health/liveness
          port: http
        initialDelaySeconds: 10
        periodSeconds: 15
        timeoutSeconds: 3
        failureThreshold: 3

    readiness:
      enabled: true
      spec:
        httpGet:
          path: /actuator/health/readiness
          port: http
        initialDelaySeconds: 5
        periodSeconds: 10
        timeoutSeconds: 3
        failureThreshold: 3

  tmpSizeLimit: 256Mi

# ────────────────────────── 단발성 백엔드 배치 ──────────────────────────

batch:
  enabled: true

  # 현재 예약 실행 활성 상태. 새 환경의 첫 검증·복구 중에는 true로 정지한다.
  suspend: false

  timeZone: Asia/Seoul
  startingDeadlineSeconds: 1800
  activeDeadlineSeconds: 3600
  backoffLimit: 2

  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3

  # 최초 배포는 파일을 삭제하지 않고 DB 후보와 로그만 기록한다.
  mediaCleanupDryRun: true

  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1024Mi

  jobs:
    account-media-cleanup:
      schedule: "*/10 * * * *"
    account-cleanup:
      schedule: "*/10 * * * *"
    # 장소 원천 재적재 + 출석 체크(폐업 판정, 하루 ~12콜) - 혼잡 적재·샘플 코스보다 먼저 돌아
    # 그날 폐업 처리된 장소가 예보 매칭·새 코스에 들어가지 않는다
    places:
      schedule: "20 2 * * *"

    congestion:
      schedule: "0 3 * * *"

    # 기존 일별 날씨: 하루 2회 유지
    weather:
      schedule: "30 3,6 * * *"

    # 알림용 최신 시간별 예보: 하루 8회
    trip-weather:
      schedule: "40 0,3,6,9,12,15,18,21 * * *"

    sample-courses:
      schedule: "0 4 * * *"

    trip-reminders:
      schedule: "10 * * * *"

    media-cleanup:
      schedule: "20 5 * * *"

# ────────────────────────── 프론트엔드 ──────────────────────────

frontend:
  replicaCount: 1
  revisionHistoryLimit: 3

  image:
    repository: lumisia/hangat-frontend
    tag: latest
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 80
    targetPort: 8080

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    fsGroup: 101
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault

  containerSecurityContext:
    allowPrivilegeEscalation: false

    # nginx-unprivileged 초기 스크립트 호환성을 위해 우선 false로 둔다.
    # 실제 OCI 기동 확인 후 true 전환할 수 있다.
    readOnlyRootFilesystem: false

    capabilities:
      drop:
        - ALL

  resources:
    requests:
      cpu: 50m
      memory: 100Mi
    limits:
      cpu: 300m
      memory: 256Mi

  probes:
    startup:
      enabled: true
      spec:
        httpGet:
          path: /
          port: http
        periodSeconds: 5
        timeoutSeconds: 3
        failureThreshold: 12

    liveness:
      enabled: true
      spec:
        httpGet:
          path: /
          port: http
        initialDelaySeconds: 5
        periodSeconds: 20
        timeoutSeconds: 3
        failureThreshold: 3

    readiness:
      enabled: true
      spec:
        httpGet:
          path: /
          port: http
        initialDelaySeconds: 2
        periodSeconds: 10
        timeoutSeconds: 3
        failureThreshold: 3


# ────────────────────────── Ingress ──────────────────────────

ingress:
  enabled: true

  className: nginx
  forceSslRedirect: "true"

  tls:
    enabled: false
    secretName: hangat-tls

  # 대표 서비스 도메인
  web:
    host: hangatjeju.com

  # 백엔드 API 도메인
  api:
    host: api.hangatjeju.com

    # Spring max-request-size가 26MB이므로 NGINX는 조금 더 크게 둔다.
    proxyBodySize: 30m
    proxyReadTimeout: "180"
    proxySendTimeout: "180"

  # API 문서 도메인
  swagger:
    enabled: false
    host: swagger.hangatjeju.com
