# 원래 요청 경로로 판별한다. SPA fallback 후 $uri는 /index.html로 바뀐다.
map $request_uri $share_access_loggable {
    default 1;
    ~^/share/ 0;
}
map $request_uri $share_robots {
    default "";
    ~^/share/ "noindex, nofollow, noarchive";
}
map $request_uri $share_cache_control {
    default "";
    ~^/share/ "no-store";
    ~^/assets/ "public, max-age=31536000, immutable";
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    access_log /var/log/nginx/access.log combined if=$share_access_loggable;

    # ────────────────────────── 보안 헤더 ──────────────────────────

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag $share_robots always;
    add_header Cache-Control $share_cache_control always;
    add_header Permissions-Policy
        "geolocation=(self), camera=(), microphone=(), payment=()"
        always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # ────────────────────────── Vue SPA ──────────────────────────

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
