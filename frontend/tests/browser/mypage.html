<!doctype html><html lang="ko" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>마이페이지 디자인 미리보기</title></head><body><div id="app"></div><script type="module">
// Local-only preview: real Vue screens, synthetic API responses, no production writes.
import {createApp,h} from 'vue';
import {createPinia} from 'pinia';
import {createRouter,createMemoryHistory,RouterView} from 'vue-router';
import MyPage from '/src/views/mypage/MyPageView.vue';
import Reviews from '/src/views/mypage/ReviewsTab.vue';
import Favorites from '/src/views/mypage/FavoritesTab.vue';
import Alerts from '/src/views/mypage/AlertsTab.vue';
import Profile from '/src/views/mypage/ProfileTab.vue';
import Header from '/src/components/layout/AppHeader.vue';
import {useAuthStore} from '/src/stores/auth.js';
import {acceptLoginResponse} from '/src/api/backendClient.js';
import '/src/assets/styles/fonts.css';
import '/src/assets/styles/tokens.css';
import '/src/assets/styles/base.css';
import '/src/assets/styles.css';
const reviews=[{reviewId:1,placeId:1,placeName:'성이시돌목장',placeCategory:'관광지',rating:5,content:'오전 일찍 방문하니 조용하게 산책하기 좋았어요. 넓은 초원과 테쉬폰을 둘러보며 여유로운 시간을 보냈습니다.',imageUrls:[location.origin+'/images/places/gwangchigi.jpg'],createdAt:new Date().toISOString(),editedAt:null,editableUntil:new Date(Date.now()+86400000).toISOString()},{reviewId:2,placeId:2,placeName:'새미은총의동산',placeCategory:'관광지',rating:4,content:'숲길을 따라 걷기 좋은 곳이에요. 다음에는 조금 더 시간을 두고 천천히 둘러보고 싶어요.',imageUrls:[],createdAt:new Date().toISOString(),editedAt:null,editableUntil:new Date(Date.now()+86400000).toISOString()}];
const names=['금오름','협재해수욕장','한림공원','비자림','사려니숲길','섭지코지','성산일출봉','월정리해변','함덕해수욕장','천지연폭포','정방폭포','산방산','송악산','용머리해안','오설록'];
let favorites=names.map((name,i)=>({placeId:i+1,name,categoryName:'관광지',categoryCode:'TOURIST',regionName:'제주',roadAddress:'제주특별자치도 · 미리보기 주소',latitude:33.4,longitude:126.5,imageUrl:'/images/places/gwangchigi.jpg',favoritedAt:new Date(Date.now()-i*86400000).toISOString(),ratingAvg:4.5,reviewCount:12,crowdRate:24,free:true,operatingHoursText:null}));
if(new URLSearchParams(location.search).has('pagination')) for(let i=3;i<=21;i++) reviews.push({...reviews[0],reviewId:i,placeName:`예시 장소 ${i}`});
if(new URLSearchParams(location.search).has('missing-images')) {
 favorites[0].imageUrl=null;
 favorites[1].imageUrl='/images/not-found-qa.jpg';
}
window.fetch=async(input,options={})=>{
 const url=new URL(typeof input==='string'?input:input.url,location.origin);let result=null;
 if(window.qaFailFavoriteDelete && options.method==='DELETE' && /\/favorites\/\d+$/.test(url.pathname)){window.qaFailFavoriteDelete=false;return Response.json({success:false,message:'테스트 찜 해제 실패'},{status:400});}
 if(window.qaFailReviewPage===Number(url.searchParams.get('page')) && url.pathname.endsWith('/users/me/reviews')) {window.qaFailReviewPage=null;return Response.json({success:false,message:'테스트 조회 실패'},{status:503});}
 if(url.pathname.endsWith('/users/me/reviews')) {const size=Number(url.searchParams.get('size')||10),page=Number(url.searchParams.get('page')||0);result={content:reviews.slice(page*size,(page+1)*size),totalElements:reviews.length,totalPages:Math.ceil(reviews.length/size),number:page};}
 else if(options.method==='DELETE' && /\/reviews\/\d+$/.test(url.pathname)) {const i=reviews.findIndex(r=>r.reviewId===Number(url.pathname.split('/').pop()));if(i>=0)reviews.splice(i,1);}
 else if(options.method==='DELETE' && /\/favorites\/\d+$/.test(url.pathname)) favorites=favorites.filter(r=>r.placeId!==Number(url.pathname.split('/').pop()));
 else if(url.pathname.endsWith('/courses')) result={content:[],totalElements:3,totalPages:1};
 else if(url.pathname.endsWith('/favorites')) result=favorites;
 else if(url.pathname.includes('/notifications')) result={content:[],items:[],totalElements:0,totalPages:0,unreadCount:0};
 else if(options.method && options.method!=='GET') return new Response(JSON.stringify({success:false,message:'미리보기에서는 저장하지 않습니다.'}),{status:403});
 return new Response(JSON.stringify({success:true,result}),{headers:{'Content-Type':'application/json'}});
};
const pinia=createPinia();const auth=useAuthStore(pinia);
const user={userId:7,nickname:'한갓지도 데모계정',email:'demo@hangatjeju.com',demoAccount:true,statusCode:'ACTIVE',emailVerified:true};
acceptLoginResponse({tokens:{accessToken:`qa.${btoa(JSON.stringify({sub:'7'}))}.fixture`,expiresIn:3600000},user});auth.user=user;auth.ready=true;
const router=createRouter({history:createMemoryHistory(),routes:[{path:'/mypage',component:MyPage,children:[{path:'reviews',name:'my-reviews',component:Reviews},{path:'favorites',name:'my-favorites',component:Favorites},{path:'alerts',name:'my-alerts',component:Alerts},{path:'profile',name:'my-profile',component:Profile}]},{path:'/places/:placeId',name:'place-detail',component:{template:'<p>장소 상세 미리보기</p>'}},{path:'/map',name:'map',component:{template:'<p>미리보기</p>'}}]});
await router.push(new URLSearchParams(location.search).get('tab')==='favorites'?'/mypage/favorites':'/mypage/reviews');
createApp({render:()=>h('div',[h(Header),h('div',{style:'padding:7px 16px;text-align:center;font-size:11px;color:var(--tx2);background:var(--surf)'},'디자인 미리보기 · 리뷰와 계정 정보는 테스트 데이터입니다.'),h(RouterView)])}).use(pinia).use(router).mount('#app');
</script></body></html>
